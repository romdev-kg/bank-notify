stages:
  - verify
  - release
  - mirror

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.android:
  image: eclipse-temurin:25-jdk-jammy
  variables:
    ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
    ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key: android-37-2-gradle-9-7
    paths:
      - .android-sdk/
      - .gradle/caches/
      - .gradle/wrapper/
  before_script:
    - bash ci/setup-android.sh

verify:
  extends: .android
  stage: verify
  script:
    - bash gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain
    - python3 ci/package-apk.py debug
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dist/
      - app/build/reports/tests/
      - app/build/reports/lint-results-debug.html
    reports:
      junit: app/build/test-results/testDebugUnitTest/TEST-*.xml

release-apk:
  extends: .android
  stage: release
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
    - umask 077
    - trap 'rm -f app/banknotify-release.jks' EXIT
    - printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/banknotify-release.jks
    - bash gradlew assembleRelease --no-daemon --console=plain
    - python3 ci/package-apk.py release
  artifacts:
    expire_in: 90 days
    paths:
      - dist/
      - app/build/outputs/mapping/release/

mirror-to-github:
  stage: mirror
  image: alpine:3.23
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - git remote add github "https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git" || git remote set-url github "https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git push github "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG"
      else
        git push github "HEAD:refs/heads/$CI_COMMIT_BRANCH"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
