# GitLab is the primary CI. Keep GitHub as a manually triggered fallback.
name: Build APK (manual fallback)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: temurin
      - name: Set up Android SDK
        run: bash ci/setup-android.sh
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      - name: Verify and build signed APK
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f app/banknotify-release.jks' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/banknotify-release.jks
          bash gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
          python3 ci/package-apk.py debug
          python3 ci/package-apk.py release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BankNotify-APK
          path: dist/*.apk
          if-no-files-found: error
